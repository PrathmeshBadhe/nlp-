<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResearchMind | Liquid Glass</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Ambient Fluid Background -->
    <div class="ambient-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#cyanGlow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                    </svg>
                    <span class="text-glow">ResearchMind</span>
                </div>
                <button class="icon-btn d-mobile" id="closeSidebarBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            
            <div class="status-indicator">
                <span class="pulse-dot"></span> Backend Online
            </div>

            <button class="glass-btn btn-primary w-100" id="newChatBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                New Research Chat
            </button>

            <div class="history-container">
                <div class="history-label">Recent Sessions</div>
                <ul class="history-list" id="historyList"></ul>
            </div>

            <div class="sidebar-footer">
                <button class="glass-btn w-100" id="themeToggleBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    Toggle Aurora Theme
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-nav glass-panel">
                <button class="icon-btn" id="menuToggleBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <div class="nav-actions">
                    <button class="glass-btn btn-sm" id="clearChatBtn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        Clear
                    </button>
                    <button class="glass-btn btn-sm" id="exportBtn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Export JSON
                    </button>
                </div>
            </header>

            <div class="chat-container" id="chatBox">
                <!-- Welcome Screen -->
                <div class="welcome-screen" id="welcomeScreen">
                    <h1 class="text-gradient">ResearchMind</h1>
                    <p class="subtitle">Hyper-Glassmorphism NLP Engine</p>
                </div>
            </div>

            <div class="bottom-area">
                <div class="quick-prompts scroll-hidden">
                    <button class="glass-chip" data-prompt="Run Benchmark Demo">Run Benchmark Demo</button>
                    <button class="glass-chip" data-prompt="Summarize paper">Summarize paper</button>
                    <button class="glass-chip" data-prompt="Analyze dataset gaps">Analyze dataset gaps</button>
                </div>

                <div class="input-dock glass-panel" id="dropZone">
                    <div class="staging-area d-none" id="stagingArea">
                        <!-- File Pills populate here -->
                    </div>
                    <div class="input-row">
                        <button class="icon-btn" id="uploadBtn" title="Attach files">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                        </button>
                        <input type="file" id="fileInput" class="d-none" accept=".json,.txt,.pdf" multiple>
                        
                        <textarea id="chatInput" rows="1" placeholder="Type a message or drop files... (Shift+Enter for newline)"></textarea>
                        
                        <button class="icon-btn" id="micBtn" title="Voice dictation">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
                        </button>
                        <button class="icon-btn btn-send" id="sendBtn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                        </button>
                    </div>
                </div>
            </div>
            
            <svg style="width:0;height:0;position:absolute;" aria-hidden="true" focusable="false">
              <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#38bdf8" />
                <stop offset="100%" stop-color="#a855f7" />
              </linearGradient>
            </svg>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="glass-panel toast-msg"></div>

    <script src="app.js"></script>
</body>
</html>
